<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="user-container" class="user-container"></div>
  <div id="loader" class="loader hidden"></div>
  <form id="edit-form" class="edit-form hidden">
    <input id="edit-name" type="text" placeholder="Name">
    <input id="edit-username" type="text" placeholder="Username">
    <input id="edit-phone" type="text" placeholder="Phone">
    <input id="edit-website" type="text" placeholder="Website">
    <input id="edit-email" type="text" placeholder="Email">
    <button type="button" id="save-button">Send</button>
  </form>

  </svg>
  <script src="js/index.js"></script>
</body>
</html>
